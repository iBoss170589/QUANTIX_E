{
  "name": "LETHIAN · preparar paquete Core 357",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "patch_blob": {
          "required": true,
          "type": "string"
        },
        "patch_sha256": {
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "paquete": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Reconstruir y verificar todos los archivos del candidato probado",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "PATCH_BLOB": "${{ inputs.patch_blob }}",
            "PATCH_SHA256": "${{ inputs.patch_sha256 }}"
          },
          "run": "python3 - <<'LETHIAN_PY'\nimport os,json,urllib.request,hashlib,io,zipfile,http.client,base64\nrepo='iBoss170589/QUANTIX_E';version='1.0.49.0';tag='v'+version\nheaders={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'LETHIAN-Publicacion','Accept':'application/vnd.github+json'}\ndef api(path,method='GET'):\n req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,headers=headers,method=method)\n with urllib.request.urlopen(req,timeout=60) as r:\n  raw=r.read();return json.loads(raw) if raw else None\nref=os.environ['PATCH_BLOB'];sha=os.environ['PATCH_SHA256']\nassert len(ref)==40 and all(x in '0123456789abcdef' for x in ref)\npatch=base64.b64decode(api('git/blobs/'+ref)['content'])\nassert hashlib.sha256(patch).hexdigest()==sha\nwith zipfile.ZipFile(io.BytesIO(patch)) as p:plan=json.loads(p.read('plan.json'));data=p.read('data.bin')\nassert plan['version']==version\nwith urllib.request.urlopen(plan['baseUrl'],timeout=120) as r:base=r.read()\nassert hashlib.sha256(base).hexdigest()==plan['baseSha256']\nfiles={}\nwith zipfile.ZipFile(io.BytesIO(base)) as old:\n for e in plan['items']:\n  name=e['name'];assert not name.startswith('/') and '..' not in name.split('/')\n  a=old.read(name) if name in old.namelist() else b''\n  b=a if 'old' in e else b''.join(a[k:k+n] if t=='c' else data[k:k+n] for t,k,n in e['ops'])\n  assert hashlib.sha256(b).hexdigest()==e['sha256'],name\n  files[name]=b\nmanifest=json.loads(files['LETHIAN.package.json'])\nassert manifest['version']==version\nexpected={f['path'].replace('\\\\','/'):f['sha256'].lower() for f in manifest['files']}\nassert set(n for n in files if not n.endswith('/') and n!='LETHIAN.package.json')==set(expected)\nfor n,h in expected.items():assert hashlib.sha256(files[n]).hexdigest()==h,n\nassert hashlib.sha256(files['QUANTIX_E.exe']).hexdigest()==plan['exeSha256'].lower()\nname='QUANTIX_E_'+version+'.zip'\nwith zipfile.ZipFile(name,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as out:\n for e in plan['items']:\n  i=zipfile.ZipInfo(e['name'],tuple(e['date']));i.compress_type=e['type'];i.external_attr=e['attrs'];out.writestr(i,files[e['name']])\nwith zipfile.ZipFile(name) as z:assert z.testzip() is None\nr=[r for r in api('releases?per_page=30') if r['tag_name']==tag];assert len(r)==1 and r[0]['draft'];r=r[0];rid=r['id']\ndef upload(filename,body):\n for a in r['assets']:\n  if a['name']==filename:api('releases/assets/'+str(a['id']),'DELETE')\n con=http.client.HTTPSConnection('uploads.github.com',timeout=120);h=dict(headers);h['Content-Type']='application/octet-stream';h['Content-Length']=str(len(body))\n con.request('POST','/repos/'+repo+'/releases/'+str(rid)+'/assets?name='+filename,body=body,headers=h)\n q=con.getresponse();raw=q.read();assert q.status==201,(filename,q.status);con.close();return json.loads(raw)\nbody=open(name,'rb').read();packageSha=hashlib.sha256(body).hexdigest();a=upload(name,body)\nassert a['digest']=='sha256:'+packageSha\nproof={'estado':'OK','version':version,'packageSha256':packageSha,'exeSha256':plan['exeSha256'],'archivos':len(expected),'sourcePatchSha256':sha,'contenido':'IDENTICO_AL_CANDIDATO_PROBADO','crc':'OK'}\nupload('VALIDACION_PAQUETE_'+version+'.json',json.dumps(proof,indent=2).encode())\nprint(json.dumps(proof))\n\nLETHIAN_PY"
        }
      ]
    }
  }
}